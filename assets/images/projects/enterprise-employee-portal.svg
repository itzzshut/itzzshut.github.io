<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>PN-06 · Enterprise Employee Portal · System schematic</title>
<desc>Four roles use an Angular 18 SPA served by nginx. It calls an Express API on Node.js 22 with a middleware pipeline and domain services. The API stores data in MySQL 8.0 and object storage. A Jenkins pipeline with SonarQube and Newman gates deploys the system.</desc>
<defs>
<pattern id="gm" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
.t{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:9px;letter-spacing:.06em;fill:#EAF3FB}
.s{fill-opacity:.7}
.m{text-anchor:middle}
.k{fill:#9FDBFF}
.b{fill:#0D3B66;stroke:#EAF3FB;stroke-opacity:.6;stroke-width:1}
.c{fill:none;stroke:#EAF3FB;stroke-opacity:.45;stroke-width:1}
.ka{fill:#0D3B66;stroke:#9FDBFF;stroke-width:1}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:.6;stroke-width:1}
.kl{fill:none;stroke:#9FDBFF;stroke-width:1}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#gm)"/>
<rect width="640" height="360" fill="url(#gM)"/>

<rect class="c" x="16" y="16" width="608" height="20"/>
<text class="t" x="24" y="30" style="font-size:10px">PN-06 · ENTERPRISE EMPLOYEE PORTAL · HR SELF-SERVICE SYSTEM SCHEMATIC</text>

<!-- actors -->
<rect class="c" x="16" y="56" width="96" height="150"/>
<text class="t s" x="24" y="72">ACTORS</text>
<rect class="b" x="24" y="84" width="80" height="20"/><text class="t m" x="64" y="97">EMPLOYEE</text>
<rect class="b" x="24" y="110" width="80" height="20"/><text class="t m" x="64" y="123">MANAGER</text>
<rect class="b" x="24" y="136" width="80" height="20"/><text class="t m" x="64" y="149">HR_ADMIN</text>
<rect class="b" x="24" y="162" width="80" height="20"/><text class="t m" x="64" y="175">SUPER_ADMIN</text>

<!-- edge -->
<rect class="c" x="140" y="56" width="104" height="150"/>
<text class="t s" x="148" y="72">EDGE</text>
<rect class="b" x="148" y="84" width="88" height="40"/>
<text class="t m" x="192" y="101">NGINX</text><text class="t s m" x="192" y="114">STATIC HOST</text>
<rect class="b" x="148" y="138" width="88" height="56"/>
<text class="t m k" x="192" y="157">ANGULAR 18</text><text class="t m" x="192" y="170">SPA</text><text class="t s m" x="192" y="184">ROLE-AWARE UI</text>
<line class="l" x1="192" y1="124" x2="192" y2="138" marker-end="url(#a)"/>

