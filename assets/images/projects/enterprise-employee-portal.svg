<text class="t s" x="280" y="92">MIDDLEWARE PIPELINE</text>
<line class="l" x1="302" y1="111" x2="455" y2="111"/>
<rect class="b" x="280" y="98" width="44" height="26"/><text class="t m" x="302" y="114">JWT</text>
<rect class="b" x="331" y="98" width="44" height="26"/><text class="t m" x="353" y="114">RBAC</text>
<rect class="b" x="382" y="98" width="44" height="26"/><text class="t m" x="404" y="114">VALID</text>
