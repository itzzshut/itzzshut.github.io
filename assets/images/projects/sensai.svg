<text x="60" y="97" class="t s" text-anchor="middle">BROWSER</text>

<rect x="16" y="140" width="88" height="60" class="b"/>
<text x="60" y="167" class="t" text-anchor="middle">CLERK</text>
<text x="60" y="181" class="t s" text-anchor="middle">AUTH</text>

<rect x="144" y="56" width="136" height="130" class="k"/>
