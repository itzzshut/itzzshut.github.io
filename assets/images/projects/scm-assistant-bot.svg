<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-03 SCM Supply Chain RAG Assistant</title>
<desc>Blueprint schematic: a supplier CSV and a governance PDF are split, embedded with Gemini and stored in Pinecone. A user query goes through a multi retrieval QA chain and a vector store retriever, and Gemini 2.5 Flash writes the final response.</desc>
<defs>
<pattern id="gm" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:0.02em;fill:#EAF3FB;text-anchor:middle}
.s{font-size:11px;fill-opacity:0.7}
.l{text-anchor:start}
.b{fill:#0D3B66;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.r{fill:#0D3B66;stroke:#9FDBFF;stroke-width:1}
.n{fill:#9FDBFF}
.w{fill:none;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.k{fill:none;stroke:#9FDBFF;stroke-width:1}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#gm)"/>
<rect width="640" height="360" fill="url(#gM)"/>

<rect class="b" x="16" y="16" width="608" height="20"/>
<text class="l" x="24" y="30">PN-03 · SCM SUPPLY CHAIN RAG ASSISTANT · FLOWISE CLOUD PIPELINE</text>

<text class="s l" x="16" y="50">INGEST PATH</text>
<rect class="b" x="16" y="58" width="110" height="32"/>
<text x="71" y="72">SUPPLIER CSV</text>
<text class="s" x="71" y="83">PURCHASE ORDERS</text>
<rect class="b" x="16" y="100" width="110" height="32"/>
<text x="71" y="114">GOVERNANCE PDF</text>
<text class="s" x="71" y="125">POLICY DOC</text>

<polyline class="w" points="126,74 146,74 146,96 164,96" marker-end="url(#a)"/>
<polyline class="w" points="126,116 146,116 146,96"/>

<rect class="b" x="166" y="74" width="120" height="44"/>
<text x="226" y="93">TEXT SPLITTER</text>
<text class="s" x="226" y="106">RECURSIVE CHAR</text>
<line class="w" x1="286" y1="96" x2="324" y2="96" marker-end="url(#a)"/>

<rect class="b" x="326" y="74" width="110" height="44"/>
<text x="381" y="93">EMBEDDINGS</text>
<text class="s" x="381" y="106">GEMINI</text>
<line class="w" x1="436" y1="96" x2="484" y2="96" marker-end="url(#a)"/>

<rect class="b" x="486" y="70" width="138" height="52"/>
<text x="555" y="93">PINECONE</text>
<text class="s" x="555" y="107">VECTOR DATABASE</text>

<line class="w" x1="242" y1="118" x2="242" y2="144" stroke-dasharray="3 3"/>
<rect class="r" x="16" y="144" width="70" height="18"/>
<text class="n" x="51" y="156">2,000 POS</text>
<rect class="r" x="94" y="144" width="88" height="18"/>
<text class="n" x="138" y="156">116 SUPPLIERS</text>
<rect class="r" x="198" y="144" width="88" height="18"/>
<text class="n" x="242" y="156">CHUNK 1000</text>

<line class="w" x1="16" y1="176" x2="624" y2="176" stroke-dasharray="4 4" stroke-opacity="0.3"/>
<text class="s l" x="16" y="196">QUERY PATH</text>

<line class="w" x1="386" y1="118" x2="386" y2="208" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text class="s l" x="394" y="160">QUERY EMBEDDING</text>

<rect class="b" x="16" y="210" width="96" height="44"/>
<text x="64" y="235">USER QUERY</text>
<line class="k" x1="112" y1="232" x2="150" y2="232" marker-end="url(#k)"/>

<rect class="b" x="152" y="210" width="130" height="44"/>
<text x="217" y="228">MULTI RETRIEVAL</text>
<text x="217" y="241">QA CHAIN</text>
<line class="k" x1="282" y1="232" x2="320" y2="232" marker-end="url(#k)"/>

<rect class="b" x="322" y="210" width="128" height="44"/>
<text x="386" y="224">VECTOR STORE</text>
<text x="386" y="236">RETRIEVER</text>
<text class="s" x="386" y="248">RETRIEVED CONTEXT</text>
<polyline class="k" points="450,232 555,232 555,124" marker-end="url(#k)"/>

<line class="k" x1="217" y1="254" x2="217" y2="288" marker-end="url(#k)"/>
<rect class="b" x="152" y="290" width="130" height="44"/>
<text x="217" y="309">GEMINI 2.5 FLASH</text>
<text class="s" x="217" y="322">LLM</text>
<line class="k" x1="282" y1="312" x2="320" y2="312" marker-end="url(#k)"/>
<rect class="b" x="322" y="290" width="128" height="44"/>
<text x="386" y="309">FINAL RESPONSE</text>
<text class="s" x="386" y="322">GROUNDED ANSWER</text>

<rect class="b" x="486" y="290" width="138" height="44" stroke-opacity="0.4"/>
<line class="k" x1="496" y1="305" x2="520" y2="305"/>
<text class="s l" x="528" y="308">QUERY PATH</text>
<line class="w" x1="496" y1="322" x2="520" y2="322"/>
<text class="s l" x="528" y="325">INGEST PATH</text>
</svg>