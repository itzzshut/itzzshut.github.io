<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="ttl dsc">
<title id="ttl">PN-04 pulseboard-ops architecture</title>
<desc id="dsc">Stripe, GitHub, generic JSON webhooks and a custom SDK pass through signature verification and a Redis rate limiter into a MongoDB rule engine (pattern, threshold, spike). Events and alerts go to a Socket.IO multi-tenant React dashboard, and alerts go to Slack and email.</desc>
