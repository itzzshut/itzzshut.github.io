<rect class="c" x="514" y="56" width="110" height="150"/>
<text class="t s" x="522" y="72">DATA</text>
<rect class="ka" x="522" y="86" width="94" height="54"/>
<ellipse class="ka" cx="569" cy="86" rx="47" ry="5"/>
<text class="t m k" x="569" y="108">MYSQL 8.0</text><text class="t s m" x="569" y="122">ORG CTE</text>
<rect class="b" x="522" y="152" width="94" height="44"/>
<text class="t m" x="569" y="171">OBJECT</text><text class="t m" x="569" y="184">STORAGE</text>

<!-- main arrows -->
<line class="kl" x1="112" y1="131" x2="140" y2="131" marker-end="url(#k)"/>
<line class="kl" x1="244" y1="131" x2="272" y2="131" marker-end="url(#k)"/>
<polyline class="kl" points="486,112 500,112 500,113 514,113" marker-end="url(#k)"/>
<line class="l" x1="486" y1="174" x2="514" y2="174" marker-end="url(#a)"/>

<!-- readouts -->
<rect class="ka" x="16" y="214" width="96" height="22"/>
<text class="t m" x="64" y="228"><tspan class="k">4</tspan> ROLES</text>
<rect class="ka" x="279" y="214" width="200" height="22"/>
