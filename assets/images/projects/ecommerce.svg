<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-02 E-Commerce Store system schematic</title>
<desc>React and Zustand client calls a Node/Express REST API using JWT tokens. The API uses MongoDB, Redis, Cloudinary and Stripe.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 8,4 0,8" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 8,4 0,8" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:0.02em;text-transform:uppercase;fill:#EAF3FB}
.h{font-size:11px;font-weight:bold}
.s{fill-opacity:0.7}
.n{fill:#9FDBFF;font-size:11px;font-weight:bold}
.b{fill:none;stroke:#EAF3FB;stroke-opacity:0.6;stroke-width:1}
.i{fill:none;stroke:#EAF3FB;stroke-opacity:0.4;stroke-width:1}
.l{stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1;fill:none}
.kl{stroke:#9FDBFF;stroke-width:1;fill:none}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#mn)"/>
<rect width="640" height="360" fill="url(#mj)"/>

<rect class="b" x="16" y="16" width="608" height="28"/>
<text class="h" x="24" y="34">PN-02 · E-Commerce Store · System Schematic</text>

<rect class="b" x="16" y="60" width="160" height="140"/>
<text class="h" x="24" y="77">Client</text>
<rect class="i" x="28" y="90" width="136" height="28"/>
<text x="36" y="108">React UI</text>
<rect class="i" x="28" y="126" width="136" height="28"/>
<text x="36" y="144">Zustand store</text>
<rect class="i" x="28" y="162" width="136" height="28"/>
<text x="36" y="180">Admin dashboard</text>

<rect class="b" x="16" y="216" width="160" height="24"/>
<text class="s" x="24" y="232">Collections</text>
<text class="n" x="168" y="232" text-anchor="end">3</text>
<rect class="b" x="16" y="244" width="160" height="24"/>
<text class="s" x="24" y="260">JWT tokens</text>
<text class="n" x="168" y="260" text-anchor="end">2</text>
<rect class="b" x="16" y="272" width="160" height="24"/>
<text class="s" x="24" y="288">API port</text>
<text class="n" x="168" y="288" text-anchor="end">5000</text>

<rect class="b" x="232" y="60" width="176" height="240"/>
<text class="h" x="240" y="77">Node / Express API</text>
<rect class="i" x="244" y="90" width="152" height="28"/>
<text x="252" y="108">Auth · JWT</text>
<rect class="i" x="244" y="126" width="152" height="28"/>
<text x="252" y="144">Products · Cart</text>
<rect class="i" x="244" y="162" width="152" height="28"/>
<text x="252" y="180">Coupons</text>
<rect class="i" x="244" y="198" width="152" height="28"/>
<text x="252" y="216">Checkout</text>
<rect class="i" x="244" y="234" width="152" height="28"/>
<text x="252" y="252">Sales analytics</text>
<text class="s" x="240" y="288">REST · JSON</text>

<line class="kl" x1="176" y1="140" x2="232" y2="140" marker-start="url(#k)" marker-end="url(#k)"/>
<text class="s" x="190" y="130">REST</text>
<text class="s" x="192" y="156">JWT</text>

<rect class="b" x="464" y="60" width="160" height="64"/>
<text class="h" x="472" y="78">MongoDB</text>
<text class="s" x="472" y="94">Products·Carts·Coupons</text>
<text class="s" x="472" y="110">Primary data store</text>
<rect class="b" x="464" y="140" width="160" height="44"/>
<text class="h" x="472" y="158">Redis cache</text>
<text class="s" x="472" y="174">Upstash</text>
<rect class="b" x="464" y="200" width="160" height="44"/>
<text class="h" x="472" y="218">Cloudinary</text>
<text class="s" x="472" y="234">Product media</text>
<rect class="b" x="464" y="256" width="160" height="44"/>
<text class="h" x="472" y="274">Stripe</text>
<text class="s" x="472" y="290">Checkout sessions</text>

<line class="kl" x1="408" y1="92" x2="464" y2="92" marker-start="url(#k)" marker-end="url(#k)"/>
<line class="l" x1="408" y1="162" x2="464" y2="162" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="l" x1="408" y1="222" x2="464" y2="222" marker-end="url(#a)"/>
<line class="l" x1="408" y1="278" x2="464" y2="278" marker-start="url(#a)" marker-end="url(#a)"/>

<rect class="b" x="16" y="316" width="608" height="28"/>
<text class="s" x="24" y="334">Flow: UI → store → REST → API → data services</text>
<text class="s" x="616" y="334" text-anchor="end">Sheet 1/1</text>
</svg>